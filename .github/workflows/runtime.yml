name: Build Runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/**'

env:
  RUNTIME_DIR: runtime/libtorch
  FC_BASE_DIR: runtime/libtorch/fc_base

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-13 已退役；当前托管机使用 macos-latest（或 macos-14），仅提供 Xcode 16/26 等。
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v3

      # 固定当前镜像上存在的 Xcode 16.x（Apple Clang 16）；不再提供 Xcode 14。
      - name: Select Xcode 16.4 (Apple Clang 16)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      # Pin CMake 3.x: GitHub-hosted runners may ship CMake 4, which rejects
      # FetchContent deps with cmake_minimum_required < 3.5 (gflags/glog).
      - uses: lukka/get-cmake@v4.2.2
        with:
          cmakeVersion: 3.31.5

      - name: Cache FC Base
        uses: actions/cache@v3
        with:
          path: ${{ env.FC_BASE_DIR }}
          key: ${{ runner.os }}-fc-base

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-build

      - name: Install GCC 11 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11

      - name: Build
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CC=gcc-11 CXX=g++-11
          fi
          cd ${{ env.RUNTIME_DIR }}
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          if [ "$RUNNER_OS" = "Linux" ]; then JOBS=$(nproc); else JOBS=$(sysctl -n hw.ncpu); fi
          cmake --build build -j"${JOBS}"
