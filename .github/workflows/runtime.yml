name: Build Runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/**'

env:
  RUNTIME_DIR: runtime/libtorch
  FC_BASE_DIR: runtime/libtorch/fc_base

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v3

      # Pin CMake 3.x: GitHub-hosted runners may ship CMake 4, which rejects
      # FetchContent deps with cmake_minimum_required < 3.5 (gflags/glog).
      - uses: lukka/get-cmake@v4.2.2
        with:
          cmakeVersion: 3.31.5

      - name: Cache FC Base
        uses: actions/cache@v3
        with:
          path: ${{ env.FC_BASE_DIR }}
          key: ${{ runner.os }}-fc-base

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-build

      - name: Install GCC 11 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11

      # Apple Clang 14 随 Xcode 14 提供（不是 Homebrew 的 llvm@14）。
      # 若报错 “Could not find Xcode version … 14”，说明当前托管镜像未预装 Xcode 14，
      # 需改用自托管 Mac（安装 Xcode 14）或换用镜像里存在的 Xcode 版本。
      - name: Select Xcode 14 (Apple Clang 14)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "14"

      - name: Build
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          if [ "$RUNNER_OS" = "Linux" ]; then
            export CC=gcc-11 CXX=g++-11
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            export CC=clang CXX=clang++
            clang --version
          fi
          cd ${{ env.RUNTIME_DIR }}
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          if [ "$RUNNER_OS" = "Linux" ]; then JOBS=$(nproc); else JOBS=$(sysctl -n hw.ncpu); fi
          cmake --build build -j"${JOBS}"
